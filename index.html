<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>RadioTelescope</title>

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1c1c1c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="RadioTelescope" />
<link rel="apple-touch-icon" href="./icon-512.png" />
<link rel="icon" type="image/png" href="./icon-512.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0: #15161a;
    --bg-1: #1c1e24;
    --bg-2: #262932;
    --surface: #20232a;
    --surface-hover: #2a2e37;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --accent: #00E5FF;
    --accent-2: #7C3AED;
    --text: #f0f2f5;
    --text-dim: #9ca3af;
    --danger: #e03131;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
  }
  body[data-theme="black"] {
    --bg-0: #000000;
    --bg-1: #0a0a0a;
    --bg-2: #141414;
    --surface: #0f0f0f;
    --surface-hover: #1a1a1a;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.12);
    --text: #ffffff;
    --text-dim: #888;
  }
  body[data-theme="light"] {
    --bg-0: #f5f6f8;
    --bg-1: #ffffff;
    --bg-2: #eef0f3;
    --surface: #ffffff;
    --surface-hover: #f0f2f5;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --text: #0f172a;
    --text-dim: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    overflow: hidden;
    transition: background .3s ease, color .3s ease;
  }

  #app {
    height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ============ ШАПКА ============ */
  header {
    padding: 12px 16px 8px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .topbar h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 2px;
    color: var(--accent);
    flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-logo {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
  }
  .brand-logo svg { width: 22px; height: 22px; }

  .mute-btn {
    width: 36px; height: 36px;
    flex: 0 0 36px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s ease;
  }
  .mute-btn:disabled { opacity: .4; cursor: not-allowed; }
  .mute-btn.active {
    color: #4ade80;
    border-color: #4ade80;
    box-shadow: 0 0 12px rgba(74, 222, 128, .4);
  }
  .mute-btn.muted {
    color: #f87171;
    border-color: #f87171;
    box-shadow: none;
  }
  .mute-btn svg { width: 18px; height: 18px; }

  .topbar-btn {
    padding: 8px 14px;
    font-family: var(--font);
    font-size: 12px; font-weight: 500; letter-spacing: .5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    cursor: pointer;
    transition: all .2s ease;
    white-space: nowrap;
  }
  .topbar-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }

  /* ============ ЧИПЫ ============ */
  .chips-wrap { display: flex; align-items: center; gap: 6px; }
  .chips-arrow {
    width: 28px; height: 28px;
    flex: 0 0 28px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    transition: all .2s ease;
  }
  .chips-arrow:hover { color: var(--text); border-color: var(--border-strong); }
  .chips-arrow svg { width: 12px; height: 12px; }

  .chips {
    flex: 1;
    display: flex; gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
    scroll-behavior: smooth;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-family: var(--font);
    font-size: 12.5px; font-weight: 500;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer; white-space: nowrap;
    transition: all .2s ease;
  }
  .chip:hover { color: var(--text); background: var(--surface-hover); }
  .chip.active {
    color: var(--bg-0);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  @media (max-width: 767px) {
    .chips-arrow { display: flex; }
  }

  /* ============ КОНТЕНТ ============ */
  main {
    flex: 1; overflow-y: auto;
    padding: 12px 12px 120px;
    scrollbar-width: thin;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .grid {
    display: flex; flex-direction: column; gap: 10px;
  }
  @media (min-width: 768px) {
    main { padding: 16px 16px 120px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
      align-items: start;
    }
  }

  /* ============ КАРТОЧКА СТАНЦИИ ============ */
  .station {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, transform .2s ease, box-shadow .3s ease, opacity .3s ease;
    position: relative;
  }
  .station:hover { background: var(--surface-hover); border-color: var(--border-strong); }

  body.is-playing .station:not(.active) { opacity: 0.4; }

  .station.active {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg-1);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--accent), 0 8px 24px rgba(0,0,0,.4);
    transform: scale(1.02);
    padding: 16px 16px;
  }

  .station-logo {
    width: 42px; height: 42px;
    flex: 0 0 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--bg-0);
    font-weight: 700;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
  }
  .station.active .station-logo {
    width: 48px; height: 48px; flex: 0 0 48px;
    font-size: 20px;
  }

  .station-info { flex: 1; min-width: 0; }
  .station-name {
    font-size: 14px; font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .station.active .station-name { font-size: 15px; color: var(--accent); }
  .station-note {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .station-play-btn {
    width: 40px; height: 40px;
    flex: 0 0 40px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s ease;
  }
  .station-play-btn:hover { background: var(--surface-hover); color: var(--accent); border-color: var(--accent); }
  .station-play-btn svg { width: 16px; height: 16px; }
  .station.active .station-play-btn {
    background: var(--accent);
    color: var(--bg-0);
    border-color: var(--accent);
  }

  /* ============ ФИКСИРОВАННЫЙ ПОДВАЛ САЙТА ============ */
  #siteFooter {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: var(--bg-1);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 20px rgba(0,0,0,.3);
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: .5px;
  }
  .footer-row:first-child { padding-bottom: 4px; }
  .footer-row:last-child { padding-top: 4px; }
  .footer-author {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: opacity .2s ease;
  }
  .footer-author:hover { opacity: .7; }

  #playerControls {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--border);
  }
  #playerControls.show { display: flex; }

  .vol-wrap {
    display: flex; align-items: center; gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .vol-wrap svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: var(--text-dim); }
  .vol-wrap input[type=range] { flex: 1; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 20px;
    background: transparent;
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    background: var(--border-strong);
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    cursor: pointer;
  }
  input[type=range]::-moz-range-track { height: 4px; background: var(--border-strong); border-radius: 2px; }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
  }

  .ctrl-btns {
    display: flex; align-items: center; gap: 4px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s ease;
  }
  .ctrl-btn:hover { background: var(--surface-hover); color: var(--accent); border-color: var(--accent); }
  .ctrl-btn svg { width: 14px; height: 14px; }
  .ctrl-btn.play-main {
    width: 40px; height: 40px;
    background: var(--accent);
    color: var(--bg-0);
    border-color: var(--accent);
  }
  .ctrl-btn.play-main svg { width: 16px; height: 16px; }
  .ctrl-btn.play-main:hover { background: var(--accent); color: var(--bg-0); }
  .ctrl-btn.eq-btn.on {
    background: var(--accent); color: var(--bg-0); border-color: var(--accent);
  }

  .mute-desktop { display: none; }
  @media (min-width: 768px) {
    .mute-desktop { display: flex; }
    .mute-in-header { display: none; }
  }

  /* ============ ЭКВАЛАЙЗЕР ============ */
  #eqPanel {
    position: fixed;
    bottom: 100%;
    left: 0; right: 0;
    z-index: 45;
    background: var(--bg-1);
    border-top: 1px solid var(--border-strong);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 32px rgba(0,0,0,.5);
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.22,1,.36,1);
    max-height: 0;
    overflow: hidden;
  }
  #eqPanel.show {
    transform: translateY(0);
    max-height: 280px;
  }
  .eq-header {
    padding: 10px 16px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .eq-reset {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 11px; font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .eq-reset:hover { color: var(--accent); }

  .eq-sliders {
    display: flex; justify-content: space-between;
    padding: 16px 16px 12px;
    gap: 6px;
  }
  .eq-band {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    min-width: 0;
  }
  .eq-label {
    font-size: 10px; color: var(--text-dim);
    font-weight: 500;
  }
  .eq-band input[type=range] {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 6px; height: 90px;
    padding: 0;
  }
  .eq-band input[type=range]::-webkit-slider-runnable-track {
    width: 4px; height: 100%;
    background: var(--border-strong);
    border-radius: 2px;
  }
  .eq-band input[type=range]::-webkit-slider-thumb {
    width: 16px; height: 16px;
    margin-left: -6px; margin-top: 0;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .eq-band input[type=range]::-moz-range-track {
    width: 4px; background: var(--border-strong); border-radius: 2px;
  }
  .eq-band input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    background: var(--accent); border: none;
  }

  @media (min-width: 768px) {
    #eqPanel {
      left: auto;
      width: 30%;
      min-width: 340px;
      border-radius: 16px 0 0 0;
    }
  }

  /* ============ МОДАЛКИ ============ */
  #modalBackdrop {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #modalBackdrop.show { opacity: 1; visibility: visible; }
  .modal {
    background: var(--bg-1);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    max-width: 460px; width: 100%;
    transform: translateY(20px) scale(.96);
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    max-height: 80vh; overflow-y: auto;
  }
  #modalBackdrop.show .modal { transform: translateY(0) scale(1); }
  .modal-title {
    padding: 16px 20px 12px;
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
  }
  .modal-body { padding: 16px 20px; }
  .modal p { font-size: 13.5px; line-height: 1.6; color: var(--text); margin-bottom: 10px; }
  .modal p.dim { color: var(--text-dim); font-size: 12.5px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modal-btn {
    flex: 1; padding: 12px 16px;
    font-family: var(--font);
    font-size: 13px; font-weight: 600; letter-spacing: 1px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: all .2s ease;
  }
  .modal-btn:hover { background: var(--surface-hover); }
  .modal-btn.primary {
    background: var(--accent);
    color: var(--bg-0);
    border-color: var(--accent);
  }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    gap: 12px;
  }
  .settings-row:last-of-type { border-bottom: none; }
  .settings-row .settings-label { flex: 1; }
  .settings-row .settings-label span { color: var(--text); font-weight: 500; }
  .settings-row .settings-label small { color: var(--text-dim); font-size: 11.5px; display: block; margin-top: 2px; }

  .theme-selector { display: flex; gap: 6px; }
  .theme-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    cursor: pointer;
    transition: all .2s ease;
  }
  .theme-btn.active { border-color: var(--accent); transform: scale(1.1); }
  .theme-btn[data-theme="dark"] { background: #15161a; }
  .theme-btn[data-theme="black"] { background: #000000; }
  .theme-btn[data-theme="light"] { background: #f5f6f8; }

  .color-presets {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding-top: 4px;
    justify-content: flex-end;
  }
  .color-preset {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all .2s ease;
    position: relative;
  }
  .color-preset::after {
    content: '';
    position: absolute; inset: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c1), var(--c2));
  }
  .color-preset.active { border-color: var(--text); transform: scale(1.1); }

  .font-selector {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 4px;
    justify-content: flex-end;
  }
  .font-btn {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all .2s ease;
  }
  .font-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .font-btn.active { color: var(--bg-0); background: var(--accent); border-color: var(--accent); font-weight: 600; }

  .toggle-switch {
    width: 44px; height: 26px;
    border-radius: 999px;
    background: var(--border-strong);
    position: relative;
    cursor: pointer;
    transition: background .25s ease;
    flex: 0 0 44px;
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: transform .25s ease;
  }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch.on::after { transform: translateX(18px); }

  @media (max-width: 400px) {
    .eq-sliders { padding: 12px 10px 10px; gap: 4px; }
    .eq-band input[type=range] { height: 70px; }
    .eq-label { font-size: 9px; }
    .topbar h1 { font-size: 15px; letter-spacing: 1px; }
    .ctrl-btns { gap: 3px; }
    .ctrl-btn { width: 32px; height: 32px; }
    .ctrl-btn.play-main { width: 38px; height: 38px; }
  }
</style>
</head>
<body data-theme="dark">

<div id="app">
  <header>
    <div class="topbar">
      <button class="mute-btn mute-in-header" id="muteBtnHeader" disabled title="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <div class="brand-logo" id="brandLogo" style="display:none;">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="4" opacity=".4"/>
          <circle cx="50" cy="50" r="10" fill="currentColor"/>
          <path d="M50 40V18M50 60V82M40 50H18M60 50H82" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>RADIOTELESCOPE</h1>
      <button class="topbar-btn" id="openSettingsBtn">НАСТРОЙКИ</button>
    </div>
    <div class="chips-wrap">
      <button class="chips-arrow" id="chipsLeft" title="Влево">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="chips" id="chips"></div>
      <button class="chips-arrow" id="chipsRight" title="Вправо">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="eqPanel">
  <div class="eq-header">
    <span>ЭКВАЛАЙЗЕР</span>
    <button class="eq-reset" id="eqReset">СБРОС</button>
  </div>
  <div class="eq-sliders" id="eqSliders">
    <div class="eq-band"><span class="eq-label">60</span><input type="range" min="-12" max="12" value="0" data-freq="60"></div>
    <div class="eq-band"><span class="eq-label">170</span><input type="range" min="-12" max="12" value="0" data-freq="170"></div>
    <div class="eq-band"><span class="eq-label">310</span><input type="range" min="-12" max="12" value="0" data-freq="310"></div>
    <div class="eq-band"><span class="eq-label">600</span><input type="range" min="-12" max="12" value="0" data-freq="600"></div>
    <div class="eq-band"><span class="eq-label">1K</span><input type="range" min="-12" max="12" value="0" data-freq="1000"></div>
    <div class="eq-band"><span class="eq-label">3K</span><input type="range" min="-12" max="12" value="0" data-freq="3000"></div>
    <div class="eq-band"><span class="eq-label">6K</span><input type="range" min="-12" max="12" value="0" data-freq="6000"></div>
    <div class="eq-band"><span class="eq-label">12K</span><input type="range" min="-12" max="12" value="0" data-freq="12000"></div>
  </div>
</div>

<footer id="siteFooter">
  <div class="footer-row">
    <span>Dev. 2026</span>
    <a class="footer-author" href="https://github.com/SayanWolf" target="_blank" rel="noopener">©SayanWolf</a>
  </div>
  <div id="playerControls">
    <div class="vol-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" id="volume" min="0" max="100" value="70" />
    </div>
    <div class="ctrl-btns">
      <button class="ctrl-btn" id="prevBtn" title="Предыдущая">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-main" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Следующая">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
      <button class="ctrl-btn eq-btn" id="eqBtn" title="Эквалайзер">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M8 20V4M12 20V14M16 20V8M20 20V12"/></svg>
      </button>
      <button class="mute-btn mute-desktop" id="muteBtnDesktop" disabled title="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5z"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<div id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<audio id="audioEl" preload="none" crossorigin="anonymous"></audio>
<script>
/* ============== ДАННЫЕ ============== */
const ALL_STATIONS = [
  {
    n: "Dub Ninja",
    note: "Dub techno и эмбиент для фокуса",
    genre: "Электронная",
    country: "DE",
    stream: "https://dub.ninja/live"
  },
  {
    n: "EBM Radio",
    note: "EBM, dark electro, industrial из Германии",
    genre: "Электронная",
    country: "DE",
    stream: "https://stream.ebm-radio.org/hq"
  },
  {
    n: "Frisky Radio",
    note: "Подпольные электронные DJ-сеты с 2008",
    genre: "Электронная",
    country: "US",
    stream: "https://stream.friskyradio.com/frisky_mp3_hi"
  }
];

const CATEGORIES = ["Все станции", "Избранное", "Электронная", "Рок", "Jazz", "Classical", "Каверы"];

/* ============== СОСТОЯНИЕ ============== */
const isMobile = () => window.innerWidth < 768;

const state = {
  activeCat: "Все станции",
  currentStation: null,
  playing: false,
  muted: false,
  theme: localStorage.getItem('rt_theme') || 'dark',
  accent: localStorage.getItem('rt_accent') || '#00E5FF',
  accent2: localStorage.getItem('rt_accent2') || '#7C3AED',
  font: localStorage.getItem('rt_font') || 'Inter',
  saveEq: JSON.parse(localStorage.getItem('rt_save_eq') ?? (isMobile() ? 'true' : 'false')),
  favorites: JSON.parse(localStorage.getItem('rt_favorites') || '[]'),
  eqValues: JSON.parse(localStorage.getItem('rt_eq_values') || '{}'),
  eqCloseTimer: null,
  currentList: [],
  currentIndex: -1,
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

/* ============== ЦВЕТОВЫЕ ПРЕСЕТЫ ============== */
const COLOR_PRESETS = [
  { id: 'cyan',    c1: '#00E5FF', c2: '#7C3AED', name: 'Бирюзово-фиолетовый' },
  { id: 'violet',  c1: '#7C3AED', c2: '#A78BFA', name: 'Фиолетово-чёрный' },
  { id: 'turq',    c1: '#00E5FF', c2: '#FF8C42', name: 'Бирюзово-оранжевый' },
  { id: 'mint',    c1: '#84CC16', c2: '#14B8A6', name: 'Салатово-мятный' },
  { id: 'pink',    c1: '#EC4899', c2: '#F59E0B', name: 'Розово-золотой' },
  { id: 'steel',   c1: '#3B82F6', c2: '#94A3B8', name: 'Сине-стальной' },
  { id: 'graph',   c1: '#EF4444', c2: '#6B7280', name: 'Красно-графитовый' },
];

/* ============== ШРИФТЫ ============== */
const FONTS = [
  { id: 'Inter',  family: "'Inter', sans-serif",        loaded: true },
  { id: 'Manrope', family: "'Manrope', sans-serif",     loaded: true },
  { id: 'Rubik',  family: "'Rubik', sans-serif",        loaded: true },
  { id: 'DM Sans', family: "'DM Sans', sans-serif",     loaded: false },
  { id: 'JetBrains Mono', family: "'JetBrains Mono', monospace", loaded: false },
];

/* ============== ПРИМЕНЕНИЕ ТЕМЫ/ШРИФТА ============== */
function applyTheme() {
  document.body.dataset.theme = state.theme;
  document.documentElement.style.setProperty('--accent', state.accent);
  document.documentElement.style.setProperty('--accent-2', state.accent2);
  localStorage.setItem('rt_theme', state.theme);
  localStorage.setItem('rt_accent', state.accent);
  localStorage.setItem('rt_accent2', state.accent2);
}

function applyFont() {
  const f = FONTS.find(x => x.id === state.font) || FONTS[0];
  document.documentElement.style.setProperty('--font', f.family);
  localStorage.setItem('rt_font', state.font);
  if (!f.loaded) loadFont(f);
}

function loadFont(f) {
  if (document.getElementById('font-' + f.id.replace(/\s/g, ''))) return;
  const link = document.createElement('link');
  link.id = 'font-' + f.id.replace(/\s/g, '');
  link.rel = 'stylesheet';
  if (f.id === 'DM Sans') link.href = 'https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap';
  if (f.id === 'JetBrains Mono') link.href = 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap';
  document.head.appendChild(link);
  f.loaded = true;
}

/* ============== ФИЛЬТРЫ ============== */
function getStationsByCat(cat) {
  if (cat === "Все станции") return ALL_STATIONS;
  if (cat === "Избранное") return ALL_STATIONS.filter(s => state.favorites.includes(s.n));
  return ALL_STATIONS.filter(s => s.genre === cat);
}

/* ============== ИЗБРАННОЕ ============== */
function saveFavorites() { localStorage.setItem('rt_favorites', JSON.stringify(state.favorites)); }
function toggleFavorite(name) {
  const idx = state.favorites.indexOf(name);
  if (idx === -1) state.favorites.push(name);
  else state.favorites.splice(idx, 1);
  saveFavorites();
  if (state.activeCat === "Избранное") render();
}

/* ============== РЕНДЕР ============== */
const grid = $('#grid');

function getStationInitial(name) {
  return (name || '?').trim().charAt(0).toUpperCase();
}

function createStationCard(s, index) {
  const el = document.createElement('div');
  el.className = 'station';
  el.dataset.name = s.n;
  el.dataset.index = index;
  el.innerHTML = `
    <div class="station-logo">${getStationInitial(s.n)}</div>
    <div class="station-info">
      <div class="station-name">${s.n}</div>
      <div class="station-note">${s.note || ''}</div>
    </div>
    <button class="station-play-btn" title="Play/Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>`;
  el.querySelector('.station-play-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.currentStation === s) togglePlay();
    else selectStation(s, el, index);
  });
  el.addEventListener('click', (e) => {
    if (e.target.closest('.station-play-btn')) return;
    if (state.currentStation === s) togglePlay();
    else selectStation(s, el, index);
  });
  return el;
}

function renderStations(list, emptyMsg) {
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = `<div style="text-align:center;color:var(--text-dim);padding:40px 16px;font-size:13px;">— ${emptyMsg || 'СТАНЦИИ НЕ НАЙДЕНЫ'} —</div>`;
    state.currentList = [];
    return;
  }
  list.forEach((s, i) => grid.appendChild(createStationCard(s, i)));
  state.currentList = list;

  if (state.currentStation) {
    const activeEl = grid.querySelector(`.station[data-name="${CSS.escape(state.currentStation.n)}"]`);
    if (activeEl) {
      activeEl.classList.add('active');
      state.currentIndex = parseInt(activeEl.dataset.index);
    }
  }
}

function render() {
  const list = getStationsByCat(state.activeCat);
  renderStations(list, state.activeCat === "Избранное" ? 'СПИСОК ПУСТ — ДОБАВЬТЕ СТАНЦИИ ПЛЮСИКОМ' : null);
}

/* ============== ЧИПЫ ============== */
const chipsEl = $('#chips');
CATEGORIES.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === state.activeCat ? ' active' : '');
  b.textContent = c;
  b.addEventListener('click', () => {
    $$('.chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.activeCat = c;
    render();
  });
  chipsEl.appendChild(b);
});

$('#chipsLeft').addEventListener('click', () => {
  chipsEl.scrollBy({ left: -150, behavior: 'smooth' });
});
$('#chipsRight').addEventListener('click', () => {
  chipsEl.scrollBy({ left: 150, behavior: 'smooth' });
});

/* ============== MUTE ============== */
const muteBtnHeader = $('#muteBtnHeader');
const muteBtnDesktop = $('#muteBtnDesktop');

function updateMuteUI() {
  const btns = [muteBtnHeader, muteBtnDesktop];
  btns.forEach(btn => {
    if (!btn) return;
    btn.classList.remove('active', 'muted');
    if (!state.currentStation || !state.playing) {
      btn.disabled = true;
    } else {
      btn.disabled = false;
      if (state.muted) btn.classList.add('muted');
      else btn.classList.add('active');
    }
  });
}

function toggleMute() {
  if (!state.currentStation) return;
  state.muted = !state.muted;
  audio.muted = state.muted;
  updateMuteUI();
}

muteBtnHeader.addEventListener('click', toggleMute);
muteBtnDesktop.addEventListener('click', toggleMute);

/* ============== ЛОГОТИП В ШАПКЕ (ДЕСКТОП) ============== */
const brandLogo = $('#brandLogo');
function updateBrandLogo() {
  brandLogo.style.display = window.innerWidth >= 768 ? 'flex' : 'none';
}
window.addEventListener('resize', updateBrandLogo);
updateBrandLogo();

/* ============== ПЛЕЕР ============== */
const audio = $('#audioEl');
const playBtn = $('#playBtn');
const playIcon = $('#playIcon');
const prevBtn = $('#prevBtn');
const nextBtn = $('#nextBtn');
const volume = $('#volume');
const playerControls = $('#playerControls');

let audioCtx = null;
let sourceNode = null;
let eqFilters = [];
const EQ_FREQS = [60, 170, 310, 600, 1000, 3000, 6000, 12000];

function initAudioGraph() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audio);
    eqFilters = EQ_FREQS.map(freq => {
      const f = audioCtx.createBiquadFilter();
      f.type = 'peaking';
      f.frequency.value = freq;
      f.Q.value = 1;
      f.gain.value = 0;
      return f;
    });
    let prev = sourceNode;
    eqFilters.forEach(f => { prev.connect(f); prev = f; });
    prev.connect(audioCtx.destination);
    applyEqGains();
  } catch (e) {
    console.warn('Web Audio не инициализирован:', e);
  }
}

function applyEqGains() {
  if (!eqFilters.length) return;
  EQ_FREQS.forEach((freq, i) => {
    const v = state.eqValues[freq] || 0;
    eqFilters[i].gain.value = v;
  });
}

function setPlayIcon(playing) {
  if (playing) {
    playIcon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function updateStationPlayBtn(el, playing) {
  if (!el) return;
  const btn = el.querySelector('.station-play-btn');
  if (!btn) return;
  if (playing) {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  } else {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
}

function selectStation(s, el, index) {
  $$('.station').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  state.currentStation = s;
  state.currentIndex = index;

  audio.src = s.stream;
  audio.volume = parseFloat(volume.value) / 100;
  audio.muted = state.muted;
  initAudioGraph();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  playerControls.classList.add('show');

  audio.play()
    .then(() => {
      state.playing = true;
      setPlayIcon(true);
      updateStationPlayBtn(el, true);
      document.body.classList.add('is-playing');
      updateMuteUI();
    })
    .catch(err => {
      console.warn('Ошибка воспроизведения:', err);
      state.playing = false;
      setPlayIcon(false);
      updateMuteUI();
    });
}

function togglePlay() {
  if (!state.currentStation) return;
  const activeEl = grid.querySelector('.station.active');

  if (state.playing) {
    audio.pause();
    state.playing = false;
    setPlayIcon(false);
    updateStationPlayBtn(activeEl, false);
    document.body.classList.remove('is-playing');
    updateMuteUI();
  } else {
    if (audio.src) {
      initAudioGraph();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play()
        .then(() => {
          state.playing = true;
          setPlayIcon(true);
          updateStationPlayBtn(activeEl, true);
          document.body.classList.add('is-playing');
          updateMuteUI();
        })
        .catch(err => console.warn('Ошибка play:', err));
    }
  }
}

function playRelative(delta) {
  const list = state.currentList;
  if (!list.length) return;
  let newIdx = (state.currentIndex + delta + list.length) % list.length;
  const s = list[newIdx];
  const el = grid.querySelector(`.station[data-name="${CSS.escape(s.n)}"]`);
  if (el) selectStation(s, el, newIdx);
}

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', () => playRelative(-1));
nextBtn.addEventListener('click', () => playRelative(1));

volume.addEventListener('input', () => {
  audio.volume = parseFloat(volume.value) / 100;
  if (state.muted && parseFloat(volume.value) > 0) {
    state.muted = false;
    audio.muted = false;
    updateMuteUI();
  }
});

/* ============== ЭКВАЛАЙЗЕР ============== */
const eqPanel = $('#eqPanel');
const eqBtn = $('#eqBtn');

function resetEqTimer() {
  clearTimeout(state.eqCloseTimer);
  state.eqCloseTimer = setTimeout(() => {
    eqPanel.classList.remove('show');
    eqBtn.classList.remove('on');
  }, 5000);
}

function openEq() {
  eqPanel.classList.add('show');
  eqBtn.classList.add('on');
  resetEqTimer();
}

function closeEq() {
  eqPanel.classList.remove('show');
  eqBtn.classList.remove('on');
  clearTimeout(state.eqCloseTimer);
}

eqBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (eqPanel.classList.contains('show')) closeEq();
  else openEq();
});

document.querySelectorAll('#eqSliders input').forEach(input => {
  const freq = input.dataset.freq;
  if (state.eqValues[freq] !== undefined) {
    input.value = state.eqValues[freq];
  }
  input.addEventListener('input', () => {
    state.eqValues[freq] = parseInt(input.value);
    applyEqGains();
    if (state.saveEq) {
      localStorage.setItem('rt_eq_values', JSON.stringify(state.eqValues));
    }
    resetEqTimer();
  });
});

$('#eqReset').addEventListener('click', () => {
  document.querySelectorAll('#eqSliders input').forEach(input => {
    input.value = 0;
    state.eqValues[input.dataset.freq] = 0;
  });
  applyEqGains();
  if (state.saveEq) localStorage.removeItem('rt_eq_values');
  resetEqTimer();
});

document.addEventListener('click', (e) => {
  if (!eqPanel.classList.contains('show')) return;
  if (e.target.closest('#eqPanel')) return;
  if (e.target.closest('#eqBtn')) return;
  closeEq();
});

/* ============== МОДАЛКИ ============== */
const modalBackdrop = $('#modalBackdrop');
const modal = $('#modal');

function getModalContent(type) {
  if (type === 'about') {
    return {
      title: "О ПРИЛОЖЕНИИ",
      html: `
        <p>RadioTelescope создан пользователем <b>SayanWolf</b> — для души и для жены ❤</p>
        <p class="dim">Если что-то не нравится — пишите на 4PDA, постараюсь исправить.</p>
        <p>Агрегатор ссылок на публичные интернет-потоки. Приложение не хранит и не ретранслирует аудио. Все права принадлежат правообладателям.</p>
        <div class="modal-actions"><button class="modal-btn primary" data-close>ЗАКРЫТЬ</button></div>`
    };
  }
  if (type === 'settings') {
    const themes = [
      { id: 'dark', label: 'Тёмная' },
      { id: 'black', label: 'Чёрная' },
      { id: 'light', label: 'Светлая' },
    ];
    return {
      title: "НАСТРОЙКИ",
      html: `
        <div class="settings-row">
          <div class="settings-label"><span>Тема</span><small>Оформление</small></div>
          <div class="theme-selector">
            ${themes.map(t => `<div class="theme-btn ${state.theme===t.id?'active':''}" data-theme="${t.id}"></div>`).join('')}
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-label"><span>Цветовая схема</span><small>Акценты</small></div>
          <div class="color-presets">
            ${COLOR_PRESETS.map(p => `<div class="color-preset ${state.accent===p.c1?'active':''}" data-c1="${p.c1}" data-c2="${p.c2}" title="${p.name}" style="--c1:${p.c1};--c2:${p.c2}"></div>`).join('')}
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-label"><span>Шрифт</span><small>Гарнитура</small></div>
          <div class="font-selector">
            ${FONTS.map(f => `<button class="font-btn ${state.font===f.id?'active':''}" data-font="${f.id}" style="font-family:${f.family}">${f.id}</button>`).join('')}
          </div>
        </div>
        <div class="settings-row">
          <div class="settings-label"><span>Сохранять эквалайзер</span><small>Между сессиями</small></div>
          <div class="toggle-switch ${state.saveEq?'on':''}" id="saveEqToggle"></div>
        </div>
        <div class="modal-actions" style="flex-direction:column;gap:8px;">
          <button class="modal-btn" id="aboutLinkBtn" style="background:transparent;border:none;color:var(--text-dim);font-size:12px;font-weight:400;letter-spacing:0;">О приложении</button>
          <button class="modal-btn primary" data-close>ГОТОВО</button>
        </div>`
    };
  }
  return null;
}

function openModal(type) {
  const c = getModalContent(type);
  if (!c) return;
  modal.innerHTML = `<div class="modal-title">${c.title}</div><div class="modal-body">${c.html}</div>`;
  modalBackdrop.classList.add('show');

  modal.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

  if (type === 'settings') {
    modal.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        modal.querySelectorAll('.theme-btn').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        state.theme = btn.dataset.theme;
        applyTheme();
      });
    });
    modal.querySelectorAll('.color-preset').forEach(p => {
      p.addEventListener('click', () => {
        modal.querySelectorAll('.color-preset').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        state.accent = p.dataset.c1;
        state.accent2 = p.dataset.c2;
        applyTheme();
      });
    });
    modal.querySelectorAll('.font-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        modal.querySelectorAll('.font-btn').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        state.font = btn.dataset.font;
        applyFont();
      });
    });
    const toggle = modal.querySelector('#saveEqToggle');
    if (toggle) {
      toggle.addEventListener('click', () => {
        state.saveEq = !state.saveEq;
        toggle.classList.toggle('on', state.saveEq);
        localStorage.setItem('rt_save_eq', JSON.stringify(state.saveEq));
        if (!state.saveEq) localStorage.removeItem('rt_eq_values');
        else localStorage.setItem('rt_eq_values', JSON.stringify(state.eqValues));
      });
    }
    const aboutLink = modal.querySelector('#aboutLinkBtn');
    if (aboutLink) {
      aboutLink.addEventListener('click', (e) => {
        e.stopPropagation();
        openModal('about');
      });
    }
  }
}

function closeModal() { modalBackdrop.classList.remove('show'); }
modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });

$('#openSettingsBtn').addEventListener('click', () => openModal('settings'));

/* ============== ИНИЦИАЛИЗАЦИЯ ============== */
render();
applyTheme();
applyFont();
updateMuteUI();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
</body>
</html>
