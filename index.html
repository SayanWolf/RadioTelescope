<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>RadioTelescope</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1c1c1c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="RadioTelescope" />
<link rel="apple-touch-icon" href="./icon-512.png" />
<link rel="icon" type="image/png" href="./icon-512.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-0: #1c1c1c;
    --bg-1: #2a2a2a;
    --bg-2: #333333;
    --surface: #262626;
    --surface-hover: #303030;
    --border: #4a4a4a;
    --border-strong: #6a6a6a;
    --accent: #00E5FF;
    --accent-2: #7C3AED;
    --text: #e8e8e8;
    --text-dim: #8a8a8a;
    --inset: inset 1px 1px 0 #000, inset -1px -1px 0 #5a5a5a;
  }
  body[data-theme="black"] {
    --bg-0: #0a0a0a; --bg-1: #141414; --bg-2: #1c1c1c;
    --surface: #161616; --surface-hover: #1f1f1f;
    --border: #2c2c2c; --border-strong: #444;
    --text: #dcdcdc; --text-dim: #6a6a6a;
  }
  body[data-theme="light"] {
    --bg-0: #d8d8d8; --bg-1: #e6e6e6; --bg-2: #efefef;
    --surface: #e0e0e0; --surface-hover: #ededed;
    --border: #a0a0a0; --border-strong: #707070;
    --text: #1a1a1a; --text-dim: #555;
    --inset: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg-0); color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size: 16px; overflow: hidden;
    transition: background .3s ease, color .3s ease;
  }

  /* SPLASH */
  #splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px; z-index: 100;
    transition: opacity .4s ease, visibility .4s;
    background: var(--bg-0); padding: 24px;
  }
  #splash.hidden { opacity: 0; visibility: hidden; }
  .splash-logo-wrap {
    width: 120px; height: 120px;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: var(--inset);
    display: flex; align-items: center; justify-content: center; padding: 14px;
  }
  .splash-logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .logo-title { font-family: 'VT323', monospace; font-size: 34px; letter-spacing: 4px; color: var(--accent); }
  .logo-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 6px; text-transform: uppercase; text-align: center; margin-top: 4px; }
  .cta-btn {
    padding: 14px 40px; font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; font-weight: 600; letter-spacing: 3px;
    color: var(--text); background: var(--bg-2);
    border: 1px solid var(--border-strong); box-shadow: var(--inset);
    cursor: pointer; transition: background .15s ease;
  }
  .cta-btn:hover { background: var(--surface-hover); }
  .cta-btn:active { box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #5a5a5a; }
  .splash-footer {
    position: absolute; bottom: 22px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 0 16px;
  }
  .splash-footer button {
    background: var(--bg-1); border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; letter-spacing: 1px; cursor: pointer; transition: all .15s ease;
  }
  .splash-footer button:hover { color: var(--text); border-color: var(--border-strong); }

  /* APP */
  #app { height: 100vh; display: flex; flex-direction: column; opacity: 0; transition: opacity .4s ease .1s; }
  #app.visible { opacity: 1; }
  header {
    padding: 10px 16px 10px; background: var(--bg-1);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topbar h1 {
    font-family: 'VT323', monospace; font-size: 22px; letter-spacing: 3px; font-weight: 400;
    color: var(--accent); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar h1 svg { width: 18px; height: 18px; vertical-align: middle; margin-right: 4px; }
  .topbar-btn {
    padding: 6px 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 1px;
    background: var(--bg-2); border: 1px solid var(--border); box-shadow: var(--inset);
    color: var(--text-dim); cursor: pointer; transition: all .15s ease; white-space: nowrap;
  }
  .topbar-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 6px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 1px;
    color: var(--text-dim); background: var(--bg-2);
    border: 1px solid var(--border); box-shadow: var(--inset);
    cursor: pointer; white-space: nowrap; transition: all .15s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active { color: var(--bg-0); background: var(--accent); border-color: var(--accent); box-shadow: none; font-weight: 600; }

  main { flex: 1; overflow-y: auto; padding: 12px 12px 260px; scrollbar-width: thin; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track { background: var(--bg-0); }
  main::-webkit-scrollbar-thumb { background: var(--border-strong); border: 2px solid var(--bg-0); }
  .grid { display: flex; flex-direction: column; gap: 3px; }
  @media (min-width: 768px) {
    main { padding: 16px 16px 260px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 4px; }
  }

  /* СТАНЦИЯ */
  .station {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s ease, opacity .3s ease, filter .3s ease;
  }
  .station:hover { background: var(--surface-hover); }
  .station.active { background: var(--bg-2); border-color: var(--accent); }
  body.is-playing .station:not(.active) { opacity: 0.35; filter: grayscale(0.8); }
  .station-logo {
    width: 32px; height: 32px; flex: 0 0 32px;
    background: var(--bg-0); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .station.active .station-logo { border-color: var(--accent); }
  .station-info { flex: 1; min-width: 0; }
  .station-artist {
    font-size: 11px; color: var(--accent); letter-spacing: 1px;
    margin-bottom: 1px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .station-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; position: relative; }
  .now-playing span { display: inline-block; }
  .now-playing.scrolling span { animation: marquee 10s linear infinite; padding-right: 40px; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .station-play {
    width: 26px; height: 26px; flex: 0 0 26px;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; font-size: 11px;
    transition: all .15s ease;
  }
  .station:hover .station-play { color: var(--accent); border-color: var(--accent); }
  .station.active .station-play { background: var(--accent); color: var(--bg-0); border-color: var(--accent); }

  /* Drill-down */
  .country-wrap { background: var(--surface); border: 1px solid var(--border); margin-bottom: 3px; }
  .country-wrap.open { border-color: var(--accent); }
  .country {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    cursor: pointer; transition: background .15s ease;
  }
  .country:hover { background: var(--surface-hover); }
  .country-flag { font-: 18px; }
  .country-name { flex: 1; font-: 13px; font-weight: 600; }
  .country-count { font-: 11px; color: var(--text-dim); }
  .country-chevron { transition: transform .25s ease; color: var(--text-dim); font-size: 10px; }
  .country-wrap.open .country-chevron { transform: rotate(180deg); color: var(--accent); }
  .country-stations { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.22,1,.36,1); }
  .country-wrap.open .country-stations { max-height: 4000px; }
  .country-stations-inner {
    padding: 4px 6px 6px; display: flex; flex-direction: column; gap: 2px;
    background: var(--bg-0); border-top: 1px solid var(--border);
  }

  /* ПЛЕЕР */
  #player {
    position: fixed; left: 0; right: 0; bottom: 0;
    transform: translateY(110%);
    transition: transform .35s cubic-bezier(.22,1,.36,1);
    z-index: 50; padding: 0 8px 8px;
  }
  #player.show { transform: translateY(0); }
  .player-inner {
    max-width: 900px; margin: 0 auto;
    background: var(--bg-1); border: 1px solid var(--border-strong);
    box-shadow: 0 0 0 1px var(--bg-0), 0 -6px 24px rgba(0,0,0,.5);
  }
  .player-main {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: var(--bg-1);
    border-bottom: 1px solid var(--border);
  }
  .viz {
    width: 56px; height: 34px; flex: 0 0 56px;
    background: var(--bg-0); border: 1px solid var(--border); box-shadow: var(--inset);
    display: flex; align-items: flex-end; justify-content: center;
    gap: 2px; padding: 3px 4px; overflow: hidden;
  }
  .viz i { width: 2px; background: var(--accent); height: 2px; transition: height .08s linear; }
  body.is-playing .viz i { animation: vizPulse .8s ease-in-out infinite alternate; }
  body.is-playing .viz i:nth-child(1) { animation-delay: 0s; }
  body.is-playing .viz i:nth-child(2) { animation-delay: .08s; }
  body.is-playing .viz i:nth-child(3) { animation-delay: .16s; }
  body.is-playing .viz i:nth-child(4) { animation-delay: .24s; }
  body.is-playing .viz i:nth-child(5) { animation-delay: .32s; }
  body.is-playing .viz i:nth-child(6) { animation-delay: .4s; }
  body.is-playing .viz i:nth-child(7) { animation-delay: .48s; }
  body.is-playing .viz i:nth-child(8) { animation-delay: .56s; }
  body.is-playing .viz i:nth-child(9) { animation-delay: .64s; }
  body.is-playing .viz i:nth-child(10) { animation-delay: .72s; }
  body.is-playing .viz i:nth-child(11) { animation-delay: .8s; }
  body.is-playing .viz i:nth-child(12) { animation-delay: .88s; }
  body.is-playing .viz i:nth-child(13) { animation-delay: .96s; }
  body.is-playing .viz i:nth-child(14) { animation-delay: 1.04s; }
  body.is-playing .viz i:nth-child(15) { animation-delay: 1.12s; }
  body.is-playing .viz i:nth-child(16) { animation-delay: 1.2s; }
  @keyframes vizPulse {
    0% { height: 3px; opacity: .5; }
    50% { height: 22px; opacity: 1; }
    100% { height: 8px; opacity: .8; }
  }
  .player-info { flex: 1; min-width: 0; }
  .player-station {
    font-size: 12px; font-weight: 600; color: var(--accent);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player-track { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; position: relative; }
  .player-track span { display: inline-block; }
  .player-track.scrolling span { animation: marquee 12s linear infinite; padding-right: 40px; }
  .play-btn, .fav-btn, .eq-btn {
    width: 38px; height: 34px; flex: 0 0 38px;
    background: var(--bg-2); border: 1px solid var(--border-strong); box-shadow: var(--inset);
    color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  .play-btn:hover, .fav-btn:hover, .eq-btn:hover { background: var(--surface-hover); }
  .play-btn:active, .fav-btn:active, .eq-btn:active {
    box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #5a5a5a;
  }
  .fav-btn { font-size: 16px; font-weight: 700; }
  .fav-btn.on { background: var(--accent); color: var(--bg-0); border-color: var(--accent); box-shadow: none; }
  .eq-btn { flex: 0 0 44px; }
  .eq-btn.on { background: var(--accent); color: var(--bg-0); border-color: var(--accent); }
  .eq-btn svg { width: 16px; height: 16px; }
  .player-volume {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--bg-1); border-bottom: 1px solid var(--border);
  }
  .player-volume label { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; width: 28px; }
  .player-volume svg { width: 14px; height: 14px; stroke: var(--text-dim); flex: 0 0 14px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 14px; background: transparent; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; background: var(--bg-0);
    border: 1px solid var(--border); box-shadow: inset 1px 1px 0 #000;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 16px; margin-top: -6px;
    background: var(--bg-2); border: 1px solid var(--border-strong);
    box-shadow: inset 1px 1px 0 #5a5a5a, inset -1px -1px 0 #000; cursor: pointer;
  }
  input[type=range]::-moz-range-track { height: 6px; background: var(--bg-0); border: 1px solid var(--border); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 16px; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 0; }

  /* ЭКВАЛАЙЗЕР */
  .eq-panel { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(.22,1,.36,1); background: var(--bg-0); }
  .player-inner.eq-open .eq-panel { max-height: 220px; }
  .eq-header {
    padding: 6px 12px; background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-size: 10px; letter-spacing: 2px; color: var(--text-dim);
    display: flex; justify-content: space-between;
  }
  .eq-header .eq-reset {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 1px;
  }
  .eq-header .eq-reset:hover { color: var(--accent); }
  .eq-sliders { display: flex; justify-content: space-between; padding: 14px 12px 8px; gap: 4px; }
  .eq-band { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .eq-band .eq-label { font-size: 9px; color: var(--text-dim); letter-spacing: .5px; white-space: nowrap; }
  .eq-band input[type=range] {
    writing-mode: vertical-lr; direction: rtl;
    width: 6px; height: 80px;
    -webkit-appearance: slider-vertical; appearance: slider-vertical; padding: 0;
  }
  .eq-band input[type=range]::-webkit-slider-runnable-track { width: 6px; height: 100%; background: var(--bg-2); border: 1px solid var(--border); }
  .eq-band input[type=range]::-webkit-slider-thumb {
    width: 16px; height: 8px; margin-left: -6px; margin-top: 0;
    background: var(--accent); border: 1px solid var(--border-strong); box-shadow: none;
  }
  .eq-scale { display: flex; justify-content: space-between; padding: 0 14px 8px; font-size: 9px; color: var(--text-dim); letter-spacing: .5px; }

  /* СТРАНИЦА СТАТИСТИКИ */
  #statsPage {
    position: fixed; inset: 0; z-index: 150; background: var(--bg-0);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.22,1,.36,1);
    pointer-events: none;
  }
  #statsPage.show { transform: translateX(0); pointer-events: auto; }
  .stats-header {
    padding: 10px 16px; background: var(--bg-1); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .stats-header h2 {
    font-family: 'VT323', monospace; font-size: 22px; letter-spacing: 3px;
    font-weight: 400; color: var(--accent); flex: 1;
  }
  .stats-close {
    padding: 6px 12px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 1px;
    background: var(--bg-2); border: 1px solid var(--border); box-shadow: var(--inset);
    color: var(--text-dim); cursor: pointer;
  }
  .stats-close:hover { color: var(--text); border-color: var(--border-strong); }
  .stats-body { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 260px; scrollbar-width: thin; }
  .stats-body::-webkit-scrollbar { width: 10px; }
  .stats-body::-webkit-scrollbar-thumb { background: var(--border-strong); border: 2px solid var(--bg-0); }
  .stats-section { margin-bottom: 24px; }
  .stats-section h3 {
    font-family: 'VT323', monospace; font-size: 20px; letter-spacing: 2px;
    color: var(--accent); margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row { margin-bottom: 10px; }
  .stat-row-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; letter-spacing: .5px; }
  .stat-row-label .name { color: var(--text); }
  .stat-row-label .pct { color: var(--accent); font-weight: 600; }
  .stat-row-label .time { color: var(--text-dim); font-size: 11px; }
  .stat-bar {
    height: 18px; background: var(--bg-1); border: 1px solid var(--border);
    box-shadow: inset 1px 1px 0 #000; position: relative; overflow: hidden;
  }
  .stat-bar-fill { height: 100%; background: var(--accent); width: 0; transition: width .6s cubic-bezier(.22,1,.36,1); }
  body[data-theme="light"] .stat-bar-fill { background: var(--border-strong); }
  .stats-empty { text-align: center; color: var(--text-dim); padding: 30px 16px; font-size: 12px; letter-spacing: 1px; }
  .stats-footer-actions { display: flex; gap: 6px; margin-top: 16px; }
  .stats-footer-actions button {
    flex: 1; padding: 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 1px;
    background: var(--bg-2); border: 1px solid var(--border-strong); box-shadow: var(--inset);
    color: var(--text-dim); cursor: pointer;
  }
  .stats-footer-actions button:hover { color: var(--text); }

  /* МОДАЛКИ */
  #modalBackdrop {
    position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.7);
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #modalBackdrop.show { opacity: 1; visibility: visible; }
  .modal {
    background: var(--bg-1); border: 1px solid var(--border-strong);
    box-shadow: 0 0 0 1px var(--bg-0), 0 12px 40px rgba(0,0,0,.6);
    max-width: 460px; width: 100%; transform: translateY(12px);
    transition: transform .3s cubic-bezier(.22,1,.36,1);
    max-height: 80vh; overflow-y: auto;
  }
  #modalBackdrop.show .modal { transform: translateY(0); }
  .modal-title {
    padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-family: 'VT323', monospace; font-size: 20px; letter-spacing: 2px; color: var(--accent);
  }
  .modal-body { padding: 16px; }
  .modal p { font-size: 12.5px; line-height: 1.6; color: var(--text); margin-bottom: 10px; }
  .modal p.dim { color: var(--text-dim); font-size: 12px; }
  .modal-actions { display: flex; gap: 6px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .modal-btn {
    flex: 1; padding: 10px 14px; font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 1px; cursor: pointer;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border-strong); box-shadow: var(--inset);
  }
  .modal-btn:hover { background: var(--surface-hover); }
  .modal-btn.primary { background: var(--accent); color: var(--bg-0); border-color: var(--accent); box-shadow: none; font-weight: 600; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row span { color: var(--text); }
  .settings-row small { color: var(--text-dim); font-size: 11px; display: block; margin-top: 2px; }
  .theme-selector { display: flex; gap: 4px; }
  .theme-btn { width: 28px; height: 28px; border: 1px solid var(--border-strong); cursor: pointer; transition: all .15s ease; }

  {n:"Milano Opera", artist:"Puccini", track:"Nessun Dorma", genre:"Classical", c:"#10B981", e:"𝄞", country:"IT", countryName:"Италия"},
  {n:"Street Orbit", artist:"Eminem", track:"Lose Yourself", genre:"Hip-Hop", c:"#F43F5E", e:"♫", country:"US", countryName:"США"},
  {n:"Brooklyn Beats", artist:"Notorious B.I.G.", track:"Juicy", genre:"Hip-Hop", c:"#DC2626", e:"♫", country:"US", countryName:"США"},
  {n:"London Grime", artist:"Skepta", track:"Shutdown", genre:"Hip-Hop", c:"#F43F5E", e:"♫", country:"GB", countryName:"Великобритания"},
  {n:"Moscow Rap", artist:"Моргенштерн", track:"Cadillac", genre:"Hip-Hop", c:"#DC2626", e:"♫", country:"RU", countryName:"Россия"},
  {n:"ATL Trap", artist:"Travis Scott", track:"SICKO MODE", genre:"Hip-Hop", c:"#F43F5E", e:"♫", country:"US", countryName:"США"},
];

const COUNTRIES = [
  {code:"US", name:"США", flag:"🇺🇸"},
  {code:"GB", name:"Великобритания", flag:"🇬🇧"},
  {code:"RU", name:"Россия", flag:"🇷🇺"},
  {code:"DE", name:"Германия", flag:"🇩🇪"},
  {code:"FR", name:"Франция", flag:"🇫🇷"},
  {code:"JP", name:"Япония", flag:"🇯🇵"},
  {code:"BR", name:"Бразилия", flag:"🇧🇷"},
  {code:"KR", name:"Южная Корея", flag:"🇰🇷"},
  {code:"CA", name:"Канада", flag:"🇨🇦"},
  {code:"AU", name:"Австралия", flag:"🇦🇺"},
  {code:"NL", name:"Нидерланды", flag:"🇳🇱"},
  {code:"ES", name:"Испания", flag:"🇪🇸"},
  {code:"IT", name:"Италия", flag:"🇮🇹"},
  {code:"AT", name:"Австрия", flag:"🇦🇹"},
  {code:"SE", name:"Швеция", flag:"🇸🇪"},
  {code:"NO", name:"Норвегия", flag:"🇳🇴"},
  {code:"IN", name:"Индия", flag:"🇮🇳"},
  {code:"CN", name:"Китай", flag:"🇨🇳"},
  {code:"MX", name:"Мексика", flag:"🇲🇽"},
  {code:"AR", name:"Аргентина", flag:"🇦🇷"},
  {code:"PL", name:"Польша", flag:"🇵🇱"},
  {code:"UA", name:"Украина", flag:"🇺🇦"},
  {code:"TR", name:"Турция", flag:"🇹🇷"},
  {code:"ZA", name:"Южная Африка", flag:"🇿🇦"},
];

const GENRES = ["Rock","Pop","Jazz","Electronic","Classical","Hip-Hop"];
const CATEGORIES = ["Все", ...GENRES, "Избранное", "Дискография", "География"];

/* ============== СОСТОЯНИЕ ============== */
const state = {
  activeCat: "Все",
  currentStation: null,
  playing: false,
  theme: localStorage.getItem('rt_theme') || 'dark',
  accent: localStorage.getItem('rt_accent') || '#00E5FF',
  accent2: localStorage.getItem('rt_accent2') || '#7C3AED',
  favorites: JSON.parse(localStorage.getItem('rt_favorites') || '[]'),
  stats: JSON.parse(localStorage.getItem('rt_stats') || '{"genres":{},"countries":{},"artists":{}}'),
  tickInterval: null,
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function setMarquee(el, text) {
  el.classList.remove('scrolling');
  const span = el.querySelector('span');
  span.textContent = text;
  if (span.scrollWidth > el.clientWidth) {
    el.classList.add('scrolling');
    span.innerHTML = text + '&nbsp;&nbsp;&nbsp;&nbsp;' + text;
  }
}

function applyTheme() {
  document.body.dataset.theme = state.theme;
  document.documentElement.style.setProperty('--accent', state.accent);
  document.documentElement.style.setProperty('--accent-2', state.accent2);
  localStorage.setItem('rt_theme', state.theme);
  localStorage.setItem('rt_accent', state.accent);
  localStorage.setItem('rt_accent2', state.accent2);
}

function getStationsByTag(tag) {
  if (tag === "Все") return ALL_STATIONS;
  return ALL_STATIONS.filter(s => s.genre === tag);
}
function getStationsByCountry(code) { return ALL_STATIONS.filter(s => s.country === code); }
function getFavoriteStations() { return ALL_STATIONS.filter(s => state.favorites.includes(s.n)); }
function getArtists() {
  const map = new Map();
  ALL_STATIONS.forEach(s => {
    if (!map.has(s.artist)) map.set(s.artist, []);
    map.get(s.artist).push(s);
  });
  return Array.from(map.entries()).sort((a,b) => a[0].localeCompare(b[0]));
}

/* ============== ИЗБРАННОЕ ============== */
function saveFavorites() { localStorage.setItem('rt_favorites', JSON.stringify(state.favorites)); }
function toggleFavorite(name) {
  const idx = state.favorites.indexOf(name);
  if (idx === -1) state.favorites.push(name);
  else state.favorites.splice(idx, 1);
  saveFavorites();
  updateFavButton();
  if (state.activeCat === "Избранное") render();
}
function updateFavButton() {
  const btn = $('#pFav');
  if (state.currentStation && state.favorites.includes(state.currentStation.n)) {
    btn.classList.add('on'); btn.textContent = '✓';
  } else {
    btn.classList.remove('on'); btn.textContent = '+';
  }
}

/* ============== СТАТИСТИКА ============== */
function saveStats() { localStorage.setItem('rt_stats', JSON.stringify(state.stats)); }
function tickStats() {
  if (!state.playing || !state.currentStation) return;
  const s = state.currentStation;
  state.stats.genres[s.genre] = (state.stats.genres[s.genre] || 0) + 1;
  state.stats.countries[s.countryName] = (state.stats.countries[s.countryName] || 0) + 1;
  state.stats.artists[s.artist] = (state.stats.artists[s.artist] || 0) + 1;
  saveStats();
}
function startTick() { stopTick(); state.tickInterval = setInterval(tickStats, 1000); }
function stopTick() { if (state.tickInterval) { clearInterval(state.tickInterval); state.tickInterval = null; } }
function formatTime(sec) {
  if (sec < 60) return sec + 'с';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + 'м ' + (sec % 60) + 'с';
  const h = Math.floor(m / 60);
  return h + 'ч ' + (m % 60) + 'м';
}

/* ============== РЕНДЕР ============== */
function createStationCard(s) {
  const el = document.createElement('div');
  el.className = 'station';
  el.dataset.name = s.n;
  el.innerHTML = `
    <div class="station-logo" style="color:${s.c}">${s.e}</div>
    <div class="station-info">
      <div class="station-artist">${s.artist}</div>
      <div class="station-name">${s.n}</div>
      <div class="now-playing"><span>${s.track}</span></div>
    </div>
    <div class="station-play">▶</div>`;
  el.addEventListener('click', () => selectStation(s, el));
  requestAnimationFrame(() => {
    const np = el.querySelector('.now-playing');
    const span = np.querySelector('span');
    if (span.scrollWidth > np.clientWidth) {
      np.classList.add('scrolling');
      span.innerHTML = span.textContent + '&nbsp;&nbsp;&nbsp;&nbsp;' + span.textContent;
    }
  });
  return el;
}

const grid = $('#grid');

function renderStations(list, emptyMsg) {
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = `<div style="text-align:center;color:var(--text-dim);padding:30px;font-size:12px;letter-spacing:1px;">— ${emptyMsg || 'СТАНЦИИ НЕ НАЙДЕНЫ'} —</div>`;
    return;
  }
  list.forEach(s => grid.appendChild(createStationCard(s)));
}

function renderCountries() {
  grid.innerHTML = '';
  COUNTRIES.forEach(c => {
    const stations = getStationsByCountry(c.code);
    const wrap = document.createElement('div');
    wrap.className = 'country-wrap';
    const header = document.createElement('div');
    header.className = 'country';
    header.innerHTML = `
      <div class="country-flag">${c.flag}</div>
      <div class="country-name">${c.name}</div>
      <div class="country-count">${String(stations.length).padStart(2,'0')}</div>
      <div class="country-chevron">▼</div>`;
    const listEl = document.createElement('div');
    listEl.className = 'country-stations';
    const inner = document.createElement('div');
    inner.className = 'country-stations-inner';
    if (stations.length) stations.forEach(s => inner.appendChild(createStationCard(s)));
    else inner.innerHTML = '<div style="padding:10px;font-size:11px;color:var(--text-dim);letter-spacing:1px;">— НЕТ ДОСТУПНЫХ СТАНЦИЙ —</div>';
    listEl.appendChild(inner);
    header.addEventListener('click', () => wrap.classList.toggle('open'));
    wrap.appendChild(header); wrap.appendChild(listEl);
    grid.appendChild(wrap);
  });
}

function renderArtists() {
  grid.innerHTML = '';
  const artists = getArtists();
  if (!artists.length) {
    grid.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:30px;font-size:12px;letter-spacing:1px;">— НЕТ ИСПОЛНИТЕЛЕЙ —</div>';
    return;
  }
  artists.forEach(([name, stations]) => {
    const wrap = document.createElement('div');
    wrap.className = 'country-wrap';
    const header = document.createElement('div');
    header.className = 'country';
    header.innerHTML = `
      <div class="country-flag">♪</div>
      <div class="country-name">${name}</div>
      <div class="country-count">${String(stations.length).padStart(2,'0')}</div>
      <div class="country-chevron">▼</div>`;
    const listEl = document.createElement('div');
    listEl.className = 'country-stations';
    const inner = document.createElement('div');
    inner.className = 'country-stations-inner';
    stations.forEach(s => inner.appendChild(createStationCard(s)));
    listEl.appendChild(inner);
    header.addEventListener('click', () => wrap.classList.toggle('open'));
    wrap.appendChild(header); wrap.appendChild(listEl);
    grid.appendChild(wrap);
  });
}

function render() {
  if (state.activeCat === "География") renderCountries();
  else if (state.activeCat === "Дискография") renderArtists();
  else if (state.activeCat === "Избранное") renderStations(getFavoriteStations(), 'СПИСОК ПУСТ — ДОБАВЬТЕ СТАНЦИИ ПЛЮСИКОМ');
  else renderStations(getStationsByTag(state.activeCat));
}

/* ============== ЧИПЫ ============== */
const chipsEl = $('#chips');
CATEGORIES.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === state.activeCat ? ' active' : '');
  b.textContent = c.toUpperCase();
  b.addEventListener('click', () => {
    $$('.chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.activeCat = c;
    render();
  });
  chipsEl.appendChild(b);
});

/* ============== ПЛЕЕР ============== */
const player = $('#player');
const playerInner = $('#playerInner');
const pStation = $('#pStation');
const pTrack = $('#pTrack');
const pPlay = $('#pPlay');
const pEq = $('#pEq');
const pFav = $('#pFav');

function selectStation(s, el) {
  $$('.station').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  state.currentStation = s;
  pStation.textContent = s.n.toUpperCase() + ' / ' + s.artist.toUpperCase();
  setMarquee(pTrack, s.track);
  state.playing = true;
  pPlay.textContent = '❚❚';
  player.classList.add('show');
  document.body.classList.add('is-playing');
  updateFavButton();
  startTick();
}

function togglePlay() {
  if (!state.currentStation) return;
  state.playing = !state.playing;
  pPlay.textContent = state.playing ? '❚❚' : '▶';
  if (state.playing) { document.body.classList.add('is-playing'); startTick(); }
  else { document.body.classList.remove('is-playing'); stopTick(); }
}
pPlay.addEventListener('click', togglePlay);
pFav.addEventListener('click', () => { if (state.currentStation) toggleFavorite(state.currentStation.n); });
pEq.addEventListener('click', () => {
  playerInner.classList.toggle('eq-open');
  pEq.classList.toggle('on');
});

/* ============== ГРОМКОСТЬ / ЭКВАЛАЙЗЕР ============== */
const vol = $('#volume');
vol.addEventListener('input', () => {});
const eqValues = {};
document.querySelectorAll('#eqSliders input').forEach(input => {
  const freq = parseInt(input.dataset.freq);
  eqValues[freq] = 0;
  input.addEventListener('input', () => {

$('#eqReset').addEventListener('click', () => {
  document.querySelectorAll('#eqSliders input').forEach(input => {
    input.value = 0;
    eqValues[parseInt(input.dataset.freq)] = 0;
  });
});

/* ============== МОДАЛКИ ============== */

const modal = $('#modal');

const modalContent = {

  },
  settings: {

    html: `
      <div class="settings-row">
        <div><span>Тема</span><small>Оформление интерфейса</small></div>
        <div class="theme-selector">
          <div class="theme-btn ${state.theme==='dark'?'active':''}" data-theme="dark"></div>
          <div class="theme-btn ${state.theme==='black'?'active':''}" data-theme="black"></div>

        </div>
      </div>
      <div class="settings-row">
        <div><span>Основной цвет</span><small>Акценты</small></div>
        <input type="color" class="color-input" id="accentPicker" value="${state.accent}">
      </div>

        <div><span>Второй цвет</span><small>Резерв</small></div>
        <input type="color" class="color-input" id="accent2Picker" value="${state.accent2}">
      </div>
      <div class="modal-actions"><button class="modal-btn primary" data-close>ГОТОВО</button></div>`
  },
  thanks: {
    title: "ПОБЛАГОДАРИТЬ",
    html: `
      <p>Если RadioTelescope вам пригодился — можно сказать спасибо автору:</p>
      <p class="dim">• Написать в ЛС на 4PDA пользователю <b>SayanWolf</b><br>
      • Поделиться ссылкой с друзьями<br>

      <div class="modal-actions"><button class="modal-btn primary" data-close>СПАСИБО!</button></div>`
  }
};

function openModal(type) {
  const c = modalContent[type];
  if (!c) return;
  modal.innerHTML = `<div class="modal-title">${c.title}</div><div class="modal-body">${c.html}</div>`;
  modalBackdrop.classList.add('show');
  modal.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  if (type === 'settings') {
    modal.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        modal.querySelectorAll('.theme-btn').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        state.theme = btn.dataset.theme;
        applyTheme();
      });
    });
    modal.querySelector('#accentPicker').addEventListener('input', e => { state.accent = e.target.value; applyTheme(); });
    modal.querySelector('#accent2Picker').addEventListener('input', e => { state.accent2 = e.target.value; applyTheme(); });
  }
}
function closeModal() { modalBackdrop.classList.remove('show'); }
modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });
document.querySelectorAll('.splash-footer button').forEach(b => {
  b.addEventListener('click', () => openModal(b.dataset.modal));
});
$('#openSettingsBtn').addEventListener('click', () => openModal('settings'));

/* ============== СТРАНИЦА СТАТИСТИКИ ============== */
const statsPage = $('#statsPage');
const statsBody = $('#statsBody');

function renderStats() {
  const { genres, countries, artists } = state.stats;
  const totalG = Object.values(genres).reduce((a,b)=>a+b, 0);
  const totalC = Object.values(countries).reduce((a,b)=>a+b, 0);
  const totalA = Object.values(artists).reduce((a,b)=>a+b, 0);

  const buildSection = (title, obj, total) => {
    const entries = Object.entries(obj).sort((a,b) => b[1] - a[1]);
    if (!entries.length) {
      return `<div class="stats-section"><h3>${title}</h3><div class="stats-empty">— НЕТ ДАННЫХ —</div></div>`;
    }
    const rows = entries.map(([name, sec]) => {
      const pct = total ? (sec / total * 100) : 0;
      return `<div class="stat-row">
        <div class="stat-row-label">
          <span class="name">${name}</span>
          <span class="pct">${pct.toFixed(1)}% · <span class="time">${formatTime(sec)}</span></span>
        </div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    return `<div class="stats-section"><h3>${title}</h3>${rows}</div>`;
  };

  const totalAll = totalG + totalC + totalA;
  let html = '';
  if (totalAll === 0) {
    html = `<div class="stats-empty" style="padding:60px 16px;">— СТАТИСТИКА ПОКА ПУСТА —<br><br>Включите любую станцию, чтобы начать учёт времени.</div>`;
  } else {
    html += buildSection('ПО ЖАНРАМ', genres, totalG);
    html += buildSection('ПО СТРАНАМ', countries, totalC);
    html += buildSection('ПО ИСПОЛНИТЕЛЯМ (ДИСКОГРАФИЯ)', artists, totalA);
    html += `<div class="stats-footer-actions"><button id="resetStatsBtn">СБРОСИТЬ СТАТИСТИКУ</button></div>`;
  }
  statsBody.innerHTML = html;
  const resetBtn = document.getElementById('resetStatsBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (confirm('Сбросить всю статистику?')) {
      state.stats = { genres:{}, countries:{}, artists:{} };
      saveStats();
      renderStats();
    }
  });
}

$('#openStatsBtn').addEventListener('click', () => { renderStats(); statsPage.classList.add('show'); });
$('#statsClose').addEventListener('click', () => { statsPage.classList.remove('show'); });

/* ============== ИНИЦИАЛИЗАЦИЯ ============== */
$('#startBtn').addEventListener('click', () => {
  $('#splash').classList.add('hidden');
  $('#app').classList.add('visible');

});
